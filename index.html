<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Nutri Gym · Control de alimentación</title>
<meta name="description" content="Control de alimentación para gimnasio. Funciona 100% en tu celular, sin cuentas ni servidores.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutri Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/hoy">
        <span class="brand-mark" aria-hidden="true">NG</span>
        <span class="brand-name">Nutri Gym</span>
      </a>
      <div class="topbar-actions">
        <button id="btn-install" class="btn btn-ghost btn-sm hidden" type="button">Instalar app</button>
        <button id="btn-theme" class="btn btn-ghost btn-sm" type="button" title="Cambiar tema">Tema</button>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="Navegación principal">
    <a href="#/hoy" data-nav="hoy" class="navitem">
      <span class="navico" aria-hidden="true">📅</span><span class="navlbl">Hoy</span>
    </a>
    <a href="#/registrar" data-nav="registrar" class="navitem navitem-main">
      <span class="navico" aria-hidden="true">＋</span><span class="navlbl">Registrar</span>
    </a>
    <a href="#/historial" data-nav="historial" class="navitem">
      <span class="navico" aria-hidden="true">📊</span><span class="navlbl">Historial</span>
    </a>
    <a href="#/perfil" data-nav="perfil" class="navitem">
      <span class="navico" aria-hidden="true">💪</span><span class="navlbl">Perfil</span>
    </a>
    <a href="#/ajustes" data-nav="ajustes" class="navitem">
      <span class="navico" aria-hidden="true">⚙️</span><span class="navlbl">Ajustes</span>
    </a>
  </nav>
</div>

<div id="offline-banner" class="offline-banner hidden">Sin conexión: mostrando datos guardados en tu celular.</div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
