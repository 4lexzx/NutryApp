<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Nutri Gym · Control de alimentación</title>
<meta name="description" content="Control de alimentación para gimnasio. Funciona 100% en tu celular, sin cuentas ni servidores.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="icon" href="./icons/icon-192-v3.png">
<link rel="apple-touch-icon" href="./icons/icon-192-v3.png">
<meta property="og:site_name" content="NutriGym">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nutri Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/hoy">
        <img class="brand-mark" src="./icons/icon-192-v3.png" alt="" width="30" height="30">
        <span class="brand-name">Nutri Gym</span>
      </a>
      <div class="topbar-actions">
        <button id="btn-notif" class="btn btn-ghost btn-sm btn-icon" type="button" aria-label="Notificaciones" title="Notificaciones">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 9.5a6 6 0 1 0-12 0c0 5.5-2.2 6.5-2.2 6.5h16.4S18 15 18 9.5z"/><path d="M10.2 19.5a2.1 2.1 0 0 0 3.6 0"/></svg>
          <span class="navdot" id="notif-badge" style="display:none">0</span>
        </button>
        <button id="btn-install" class="btn btn-ghost btn-sm btn-icon hidden" type="button" aria-label="Instalar aplicación" title="Instalar aplicación">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.8"/><path d="M11 18.5h2"/></svg>
        </button>
        <button id="btn-theme" class="btn btn-ghost btn-sm btn-icon" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="Navegación principal">
    <a href="#/hoy" data-nav="hoy" class="navitem">
      <span class="navico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg></span><span class="navlbl">Hoy</span>
    </a>
    <a href="#/historial" data-nav="historial" class="navitem">
      <span class="navico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20v-6M12 20V6M18 20v-9M3 20h18"/></svg></span><span class="navlbl">Historial</span>
    </a>
    <a href="#/registrar" data-nav="registrar" class="navitem navitem-main">
      <span class="navico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/></svg></span><span class="navlbl">Registrar</span>
    </a>
    <a href="#/social" data-nav="social" class="navitem">
      <span class="navico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="navlbl">Social</span>
      <span class="navdot" id="nav-soc-badge" style="display:none">0</span>
    </a>
    <a href="#/perfil" data-nav="perfil" class="navitem">
      <span class="navico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></span><span class="navlbl">Perfil</span>
    </a>
    <a href="#/ajustes" data-nav="ajustes" class="navitem">
      <span class="navico" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></span><span class="navlbl">Ajustes</span>
    </a>
  </nav>
</div>

<div id="offline-banner" class="offline-banner hidden">Sin conexión: mostrando datos guardados en tu celular.</div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
